[project]
name = "retail-adk-agents"
version = "1.0.0"
description = "Retail multi-agent assistant: FastAPI + Google ADK + OpenRouter (LiteLLM), deployed to Cloud Run"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904"]  # FastAPI Depends() defaults; explicit re-raise in routers

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
