# CI: runs on every PR and every push. Needs no GCP credentials and no LLM key —
# the tests use a scripted fake model (tests/fake_llm.py).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by cd.yml, which calls this workflow first
  workflow_call: # lets cd.yml reuse these jobs as its quality gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Pytest
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

      - name: validate cloudrun
        working-directory: infra/cloudrun
        run: terraform init -backend=false -input=false && terraform validate

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: retail-adk-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container boots and answers /healthz
        run: |
          docker run -d --name app -p 8080:8080 retail-adk-agents:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs app
          exit 1
